<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Skills</title>
<style>
  :root{
    --bg:#0b0e0d;
    --card-bg:#0f1413;
    --accent:#20e3b2;
    --accent-glow:rgba(32,227,178,0.55);
    --text-white:#f4f7f6;
    --text-body:#c7d1cd;
    --btn-a:#18c6ff;
    --btn-b:#20e3b2;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(600px 300px at 20% 10%, rgba(32,227,178,0.06), transparent 60%),
      radial-gradient(600px 300px at 80% 90%, rgba(24,198,255,0.05), transparent 60%),
      var(--bg);
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 24px 80px;
    overflow-x:hidden;
  }

  h1.page-title{
    font-size:2.6rem;
    font-weight:800;
    color:var(--text-white);
    margin:0 0 50px 0;
    letter-spacing:0.5px;
    opacity:0;
    transform:translateY(-16px);
    animation:dropIn 0.7s ease forwards;
  }
  h1.page-title span{
    color:var(--accent);
    text-shadow:0 0 18px var(--accent-glow);
  }

  @keyframes dropIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .skills-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(280px, 420px));
    gap:28px 40px;
    width:100%;
    max-width:960px;
  }

  @media (max-width:720px){
    .skills-grid{ grid-template-columns:1fr; }
  }

  .skill-card{
    position:relative;
    background:var(--card-bg);
    border:1px solid rgba(32,227,178,0.35);
    border-radius:14px;
    padding:26px 30px;
    text-align:center;
    opacity:0;
    transform:translateY(28px) scale(0.97);
    animation:cardRise 0.7s ease forwards;
    transition:transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    box-shadow:0 0 0 rgba(32,227,178,0);
    cursor:default;
    overflow:hidden;
  }

  /* staggered entrance */
  .skill-card:nth-child(1){ animation-delay:0.15s; }
  .skill-card:nth-child(2){ animation-delay:0.30s; }
  .skill-card:nth-child(3){ animation-delay:0.45s; }
  .skill-card:nth-child(4){ animation-delay:0.60s; }

  @keyframes cardRise{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .skill-card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:14px;
    padding:1px;
    background:linear-gradient(135deg, rgba(32,227,178,0.6), transparent 40%, rgba(24,198,255,0.4));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0;
    transition:opacity 0.35s ease;
    pointer-events:none;
  }

  .skill-card:hover{
    transform:translateY(-8px);
    box-shadow:0 14px 34px -10px var(--accent-glow), 0 0 22px rgba(32,227,178,0.18);
    border-color:rgba(32,227,178,0.7);
  }

  .skill-card:hover::before{ opacity:1; }

  .skill-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
    position:relative;
  }

  .skill-title{
    color:var(--accent);
    font-size:1.25rem;
    font-weight:700;
    margin:0;
    letter-spacing:0.3px;
  }

  .skill-tick{
    width:2px;
    height:20px;
    background:var(--accent);
    border-radius:2px;
    transform-origin:center;
    animation:tickPulse 2.6s ease-in-out infinite;
  }

  @keyframes tickPulse{
    0%, 100%{ opacity:0.55; transform:scaleY(1); }
    50%{ opacity:1; transform:scaleY(1.35); }
  }

  .skill-desc{
    color:var(--text-body);
    font-size:0.98rem;
    line-height:1.55;
    margin:0;
  }

  /* subtle sheen sweep on hover */
  .skill-card .sheen{
    position:absolute;
    top:0;
    left:-60%;
    width:40%;
    height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.05), transparent);
    transform:skewX(-20deg);
    pointer-events:none;
    transition:left 0.7s ease;
  }
  .skill-card:hover .sheen{ left:130%; }

  .back-btn{
    margin-top:56px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 34px;
    border-radius:999px;
    border:none;
    background:linear-gradient(90deg, var(--btn-a), var(--btn-b));
    color:#03181a;
    font-weight:700;
    font-size:1rem;
    text-decoration:none;
    cursor:pointer;
    position:relative;
    opacity:0;
    animation:cardRise 0.7s ease forwards;
    animation-delay:0.85s;
    box-shadow:0 0 0 rgba(32,227,178,0);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
  }

  .back-btn:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 10px 28px -6px rgba(24,198,255,0.55), 0 0 20px rgba(32,227,178,0.4);
  }

  .back-btn:active{
    transform:translateY(-1px) scale(0.99);
  }

  .back-btn::after{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:999px;
    background:linear-gradient(90deg, var(--btn-a), var(--btn-b));
    filter:blur(10px);
    opacity:0;
    z-index:-1;
    transition:opacity 0.3s ease;
    animation:glowBreathe 3s ease-in-out infinite;
  }
  .back-btn:hover::after{ opacity:0.55; }

  @keyframes glowBreathe{
    0%, 100%{ opacity:0.15; }
    50%{ opacity:0.32; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

  <h1 class="page-title">My <span>Skills</span></h1>

  <div class="skills-grid">
    {% for area in areas %}
    <div class="skill-card">
      <span class="sheen"></span>
      <div class="skill-header">
        <h2 class="skill-title">{{ area.title }}</h2>
        <span class="skill-tick"></span>
      </div>
      <p class="skill-desc">{{ area.description }}</p>
    </div>
    {% endfor %}
  </div>

  <a href="{% url 'home' %}" class="back-btn">&larr; Back to Home</a>

</body>
</html>
